name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        # macOS 上的 3.11 组合没有额外价值，留着只会烧 CI 时长
        exclude:
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 跑测试（全合成图，不需要真实屏幕）
        run: python -m pytest -q
      - name: CLI 冒烟
        # 只跑不需要屏幕的子命令；doctor 会真抓屏，无头 runner 上不可靠，不放进 CI
        run: |
          python -m pixelbus --help
          python -m pixelbus validate rules/example.yaml

  build:
    name: 打包 + twine check + 装轮子冒烟
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 装 build / twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: 构建 sdist + wheel
        run: python -m build
      - name: 元数据检查
        run: python -m twine check dist/*
      - name: 装到干净环境里冒烟
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/pixelbus --help
          /tmp/smoke/bin/pixelbus validate rules/example.yaml
          # 包内不该缺 py.typed，也不该漏掉任何模块
          /tmp/smoke/bin/python -c "import pixelbus, pixelbus.cli, pixelbus.server, pixelbus.actions, pixelbus.mcp_server, pixelbus.picker; print(pixelbus.__version__ if hasattr(pixelbus,'__version__') else 'ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: 打 tag 时挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
